services:
  traefik:
    # v3.8+: nieuwe Docker-API-client; oudere tags (v3.3) falen op Docker Engine 29+
    image: traefik:v3.8.0
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=WARN"
    ports:
      - "${TRAEFIK_PORT:-8080}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - htf
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
    depends_on:
      - traefik
    networks:
      - htf
    restart: unless-stopped

  # Eenmalige build van de Chrome-extensie. Schrijft het resultaat naar
  # ./extension/dist op de host, zodat Chrome het daar kan laden.
  # Draait mee met `docker compose up -d --build` en stopt daarna.
  extension-build:
    build:
      context: .
      dockerfile: extension/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-0}
    volumes:
      - ./extension/dist:/out
    restart: "no"

networks:
  htf:
    name: htf_net
